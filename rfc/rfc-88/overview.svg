<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 900" width="1620" height="900" class="viz-root" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Hudi schema architecture: type plane and data plane</title>
<style>
    .viz-root { color-scheme: light; --surface-1: #fcfcfb; --lane: #0b0b0b; --text-primary: #0b0b0b;
      --text-secondary: #52514e; --text-muted: #8a8984; --boundary: #2a78d6; --engine: #eb6834;
      --format: #1baf7a; --persist: #8a8984; --persist-fill: #f0efec; }
    @media (prefers-color-scheme: dark) {
      .viz-root { color-scheme: dark; --surface-1: #1a1a19; --lane: #f0efec; --text-primary: #f0efec;
        --text-secondary: #c3c2b7; --text-muted: #8a8984; --boundary: #3987e5; --engine: #d95926;
        --format: #199e70; --persist: #8a8984; --persist-fill: #383835; }
    }
    .bg { fill: var(--surface-1); }
    .h1 { fill: var(--text-primary); font-size: 20px; font-weight: 700; }
    .sub { fill: var(--text-secondary); font-size: 12.5px; }
    .legend { fill: var(--text-secondary); font-size: 12px; }
    .lane { fill: var(--lane); fill-opacity: 0.035; }
    .sep { stroke: var(--text-muted); stroke-opacity: 0.35; stroke-width: 1; }
    .row-label { fill: var(--text-muted); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .row-sub { fill: var(--text-muted); font-size: 11px; }
    .col-h { fill: var(--text-primary); font-size: 14px; font-weight: 700; text-anchor: middle; }
    .sec rect { fill: var(--lane); fill-opacity: 0.06; }
    .sec text { fill: var(--text-primary); font-size: 13.5px; font-weight: 700; }
    .boundary rect.box { fill: var(--boundary); fill-opacity: 0.12; stroke: var(--boundary); stroke-width: 2; }
    .engine rect.box { fill: var(--engine); fill-opacity: 0.12; stroke: var(--engine); stroke-width: 2; }
    .format rect.box { fill: var(--format); fill-opacity: 0.12; stroke: var(--format); stroke-width: 2; }
    .persist rect.box { fill: var(--persist-fill); stroke: var(--persist); stroke-width: 2; stroke-dasharray: 5 3; }
    .group rect.box { fill: var(--lane); fill-opacity: 0.035; stroke: var(--text-muted); stroke-width: 1.5; }
    .thick rect.box { stroke-width: 3; }
    .node:hover rect.box { fill-opacity: 0.24; }
    .t { fill: var(--text-primary); font-size: 12.5px; font-weight: 700; }
    .tc { fill: var(--text-primary); font-size: 12px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .d { fill: var(--text-secondary); font-size: 11px; }
    .c { fill: var(--text-secondary); font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .code, .cmt, .c, .d { white-space: pre; }
    .code { fill: var(--text-primary); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .cmt { fill: var(--text-muted); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .m { fill: var(--text-muted); font-size: 11px; }
    .dh { fill: var(--text-secondary); font-size: 11px; paint-order: stroke; stroke: var(--surface-1); stroke-width: 5px; stroke-linejoin: round; }
    .mh { fill: var(--text-muted); font-size: 11px; paint-order: stroke; stroke: var(--surface-1); stroke-width: 5px; stroke-linejoin: round; }
    .th { fill: var(--text-primary); font-size: 12.5px; font-weight: 700; paint-order: stroke; stroke: var(--surface-1); stroke-width: 5px; stroke-linejoin: round; }
    .tag { fill: var(--text-muted); font-size: 10.5px; text-anchor: end; }
    .edge { stroke: var(--text-secondary); stroke-width: 1.5; fill: none; }
    .bypass { stroke-dasharray: 6 4; }
    .real { stroke: var(--text-secondary); stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: var(--text-secondary); }
    .tri { fill: var(--surface-1); stroke: var(--text-secondary); stroke-width: 1.2; }
    .lbl { fill: var(--text-secondary); font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; paint-order: stroke; stroke: var(--surface-1); stroke-width: 4px; stroke-linejoin: round; }
    .lbl-s { fill: var(--text-secondary); font-size: 11px; paint-order: stroke; stroke: var(--surface-1); stroke-width: 4px; stroke-linejoin: round; }
    .badge circle { fill: var(--text-primary); }
    .badge text { fill: var(--surface-1); font-size: 11px; font-weight: 700; text-anchor: middle; }
    .pill-r88 rect { fill: var(--text-primary); }
    .pill-r88 text { fill: var(--surface-1); font-size: 10px; font-weight: 700; text-anchor: middle; }
    .pill-offer rect { fill: var(--surface-1); stroke: var(--text-primary); stroke-width: 1.2; stroke-dasharray: 3 2; }
    .pill-offer text { fill: var(--text-primary); font-size: 10px; font-weight: 700; text-anchor: middle; }
    .hook rect { fill: var(--surface-1); stroke: var(--boundary); stroke-width: 1.8; }
    .hook text { fill: var(--boundary); font-size: 10px; font-weight: 700; text-anchor: middle; }
    .panel rect { fill: var(--lane); fill-opacity: 0.035; stroke: var(--text-muted); stroke-width: 1; }
    .ph { fill: var(--text-primary); font-size: 13.5px; font-weight: 700; }
    .p { fill: var(--text-secondary); font-size: 11.5px; }
    .pn { fill: var(--text-primary); font-size: 11.5px; font-weight: 700; }
    .note { fill: var(--text-secondary); font-size: 12px; }
    .note-h { fill: var(--text-primary); font-size: 13.5px; font-weight: 700; }
    .chip { font-size: 11px; fill: var(--text-primary); text-anchor: middle; }
    .flow-h { fill: var(--text-primary); font-size: 11.5px; font-weight: 700; }
</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 z" class="tri"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1620" height="900"/>
<text class="h1" x="50" y="36">Hudi schema architecture: type plane and data plane</text>
<text class="sub" x="50" y="58">The type plane defines how a schema is represented and mapped. The data plane moves rows and predicates across layers, using the type plane at every crossing. Dependencies point one way: data plane to type plane.</text>
<rect x="50" y="76" width="14" height="14" rx="3" fill="var(--boundary)" fill-opacity="0.12" stroke="var(--boundary)" stroke-width="2"/>
<text class="legend" x="70" y="87">HoodieSchema (hub)</text>
<rect x="214" y="76" width="14" height="14" rx="3" fill="var(--engine)" fill-opacity="0.12" stroke="var(--engine)" stroke-width="2"/>
<text class="legend" x="234" y="87">Engine</text>
<rect x="299" y="76" width="14" height="14" rx="3" fill="var(--format)" fill-opacity="0.12" stroke="var(--format)" stroke-width="2"/>
<text class="legend" x="319" y="87">File format</text>
<rect x="417" y="76" width="14" height="14" rx="3" fill="var(--persist-fill)" stroke="var(--persist)" stroke-width="2" stroke-dasharray="4 2"/>
<text class="legend" x="437" y="87">Catalog / persisted</text>
<g class="pill-r88"><rect x="588" y="75" width="54" height="16" rx="8"/><text x="615" y="87">RFC-99</text></g>
<text class="legend" x="648" y="87">the hub</text>
<g class="pill-r88"><rect x="720" y="75" width="54" height="16" rx="8"/><text x="747" y="87">RFC-88</text></g>
<text class="legend" x="780" y="87">spokes + data plane (restructure proposed)</text>
<g class="pill-r88"><rect x="1083" y="75" width="60" height="16" rx="8"/><text x="1113" y="87">RFC-104</text></g>
<text class="legend" x="1149" y="87">field ids, evolution</text>
<g class="sec"><rect x="50" y="108" width="1520" height="32" rx="8"/><text x="66" y="129">Type plane: representation and mapping</text></g>
<text class="tag" x="1554" y="129">RFC-99 hub + RFC-88 spokes</text>
<g class="node boundary thick"><rect class="box" x="600" y="262" width="420" height="124" rx="8"/><text class="t" x="612" y="282">HoodieSchema (the hub)</text><text class="d" x="612" y="300">type set: INT, INT16, DECIMAL, TIMESTAMP, VARIANT, BLOB, ...</text><text class="d" x="612" y="315">interoperability table = the spec (RFC-99)</text><text class="d" x="612" y="330">field ids, SchemaTransformPlan (RFC-104)</text><text class="d" x="612" y="345">spokes never map to each other</text></g>
<g class="pill-r88"><rect x="954" y="254" width="54" height="16" rx="8"/><text x="981" y="266">RFC-99</text></g>
<g class="node persist"><rect class="box" x="690" y="156" width="240" height="60" rx="8"/><text class="t" x="702" y="176">Catalog</text><text class="d" x="702" y="194">HMS, Glue, BigQuery, Spark props</text></g>
<path class="edge" d="M810,262 L810,216" marker-end="url(#arr)"/>
<text class="lbl" x="818" y="236">CatalogSchemaRenderer</text>
<text class="lbl-s" x="818" y="249">+ TypeSystemMapper (hub to catalog)</text>
<g class="pill-r88"><rect x="1028" y="228" width="54" height="16" rx="8"/><text x="1055" y="240">RFC-88</text></g>
<g class="node engine"><rect class="box" x="200" y="290" width="240" height="68" rx="8"/><text class="t" x="212" y="310">Engine</text><text class="d" x="212" y="328">Spark, Flink, Trino, Hive</text><text class="d" x="212" y="343">own type systems (SMALLINT, ...)</text></g>
<path class="edge" d="M440,324 L600,324" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text class="lbl" x="520" y="316" text-anchor="middle">TypeSystemMapper</text>
<g class="pill-r88"><rect x="493" y="332" width="54" height="16" rx="8"/><text x="520" y="344">RFC-88</text></g>
<g class="node format"><rect class="box" x="1180" y="290" width="240" height="68" rx="8"/><text class="t" x="1192" y="310">Format</text><text class="d" x="1192" y="328">Parquet, Lance, ORC, HFile, Avro</text><text class="d" x="1192" y="343">physical layouts</text></g>
<path class="edge" d="M1020,324 L1180,324" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text class="lbl" x="1100" y="316" text-anchor="middle">FormatSchemaMapper</text>
<g class="pill-r88"><rect x="1073" y="332" width="54" height="16" rx="8"/><text x="1100" y="344">RFC-88</text></g>
<g class="node persist"><rect class="box" x="690" y="430" width="240" height="60" rx="8"/><text class="t" x="702" y="450">Persisted copies</text><text class="d" x="702" y="468">commit metadata, log headers, configs</text></g>
<path class="edge" d="M810,386 L810,430" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text class="lbl" x="818" y="412">HoodieSchema.parse / toString</text>
<g class="pill-r88"><rect x="860" y="422" width="54" height="16" rx="8"/><text x="887" y="434">RFC-99</text></g>
<g class="panel"><rect x="50" y="400" width="560" height="104" rx="8"/></g>
<text class="pn" x="66" y="422">Rules</text>
<text class="p" x="66" y="442">1  Spokes never map to each other; everything goes through HoodieSchema.</text>
<text class="p" x="66" y="460">2  Every mapper declares NATIVE / LOSSY / UNSUPPORTED per type (TypeSupport).</text>
<text class="p" x="66" y="478">3  One shared test kit for every mapper; a new type or system is added once.</text>
<g class="panel"><rect x="1010" y="400" width="560" height="104" rx="8"/></g>
<text class="pn" x="1026" y="422">Ownership</text>
<text class="p" x="1026" y="440">RFC-99: the hub (HoodieSchema, type set, interoperability table as spec, persisted form).</text>
<text class="p" x="1026" y="456">RFC-88, restructured: the spokes (mappers, TypeSupport, catalog renderers, test kit).</text>
<text class="p" x="1026" y="472">RFC-104: field ids and SchemaTransformPlan (schema-on-read evolution).</text>
<path class="edge" d="M810,566 L810,512" marker-end="url(#arr)"/>
<text class="p" x="830" y="538">the data plane uses the type plane at every arrow below; the type plane depends on nothing in the data plane,</text>
<text class="p" x="830" y="554">so the spokes can land first, before the data-plane debates (evaluation, composition) settle</text>
<g class="sec"><rect x="50" y="574" width="1520" height="32" rx="8"/><text x="66" y="595">Data plane: operations that cross the layers</text></g>
<text class="tag" x="1554" y="595">RFC-88, restructured; RFC-115 covers the Spark DataFrame write path</text>
<rect class="lane" x="50" y="598" width="1520" height="58" rx="8"/>
<text class="pn" x="66" y="620">Write</text>
<g class="pill-r88"><rect x="66" y="628" width="54" height="16" rx="8"/><text x="93" y="640">RFC-88</text></g>
<text class="m" x="126" y="640">section 2</text>
<g class="engine"><rect class="box" x="230" y="612" width="130" height="28" rx="6"/></g>
<text class="chip" x="295.0" y="630">engine rows</text>
<g class="boundary"><rect class="box" x="560" y="612" width="130" height="28" rx="6"/></g>
<text class="chip" x="625.0" y="630">HoodieSchema</text>
<g class="format"><rect class="box" x="890" y="612" width="170" height="28" rx="6"/></g>
<text class="chip" x="975.0" y="630">FileFormatIO writer</text>
<g class="format"><rect class="box" x="1230" y="612" width="160" height="28" rx="6"/></g>
<text class="chip" x="1310.0" y="630">file / log block</text>
<path class="edge" d="M360,626 L560,626" marker-end="url(#arr)"/>
<text class="lbl" x="460.0" y="620" text-anchor="middle">engine wrapper -&gt; HoodieRow</text>
<path class="edge" d="M690,626 L890,626" marker-end="url(#arr)"/>
<text class="lbl" x="790.0" y="620" text-anchor="middle">toPhysicalSchema()</text>
<path class="edge" d="M1060,626 L1230,626" marker-end="url(#arr)"/>
<text class="lbl" x="1145.0" y="620" text-anchor="middle">ValueWriter per field</text>
<text class="m" x="1230" y="656">same bytes from any engine</text>
<rect class="lane" x="50" y="674" width="1520" height="58" rx="8"/>
<text class="pn" x="66" y="696">Read</text>
<g class="pill-r88"><rect x="66" y="704" width="54" height="16" rx="8"/><text x="93" y="716">RFC-88</text></g>
<text class="m" x="126" y="716">section 2</text>
<g class="format"><rect class="box" x="230" y="688" width="130" height="28" rx="6"/></g>
<text class="chip" x="295.0" y="706">file</text>
<g class="boundary"><rect class="box" x="560" y="688" width="130" height="28" rx="6"/></g>
<text class="chip" x="625.0" y="706">file schema</text>
<g class="format"><rect class="box" x="890" y="688" width="170" height="28" rx="6"/></g>
<text class="chip" x="975.0" y="706">FileFormatIO reader</text>
<g class="engine"><rect class="box" x="1230" y="688" width="160" height="28" rx="6"/></g>
<text class="chip" x="1310.0" y="706">engine rows</text>
<path class="edge" d="M360,702 L560,702" marker-end="url(#arr)"/>
<text class="lbl" x="460.0" y="696" text-anchor="middle">fromPhysicalSchema(p, hint)</text>
<path class="edge" d="M690,702 L890,702" marker-end="url(#arr)"/>
<text class="lbl" x="790.0" y="696" text-anchor="middle">SchemaTransformPlan</text>
<path class="edge" d="M1060,702 L1230,702" marker-end="url(#arr)"/>
<text class="lbl" x="1145.0" y="696" text-anchor="middle">HoodieRow -&gt; engine view</text>
<text class="m" x="1230" y="732">fast path: VectorizedFileReader, same plan</text>
<rect class="lane" x="50" y="750" width="1520" height="58" rx="8"/>
<text class="pn" x="66" y="772">Filter / prune</text>
<g class="pill-r88"><rect x="66" y="780" width="54" height="16" rx="8"/><text x="93" y="792">RFC-88</text></g>
<text class="m" x="126" y="792">section 4</text>
<g class="engine"><rect class="box" x="230" y="764" width="130" height="28" rx="6"/></g>
<text class="chip" x="295.0" y="782">engine filter</text>
<g class="boundary"><rect class="box" x="560" y="764" width="130" height="28" rx="6"/></g>
<text class="chip" x="625.0" y="782">Hudi Expression</text>
<g class="boundary"><rect class="box" x="890" y="764" width="170" height="28" rx="6"/></g>
<text class="chip" x="975.0" y="782">candidate files</text>
<g class="format"><rect class="box" x="1230" y="764" width="160" height="28" rx="6"/></g>
<text class="chip" x="1310.0" y="782">reader / catalog filter</text>
<path class="edge" d="M360,778 L560,778" marker-end="url(#arr)"/>
<text class="lbl" x="460.0" y="772" text-anchor="middle">ExpressionTranslator</text>
<path class="edge" d="M690,778 L890,778" marker-end="url(#arr)"/>
<text class="lbl" x="790.0" y="772" text-anchor="middle">IndexPlanner + StatsEvaluator</text>
<path class="edge" d="M1060,778 L1230,778" marker-end="url(#arr)"/>
<text class="lbl" x="1145.0" y="772" text-anchor="middle">ExpressionRenderer</text>
<text class="m" x="1230" y="808">literals typed by TypeSystemMapper</text>
<rect class="lane" x="50" y="826" width="1520" height="58" rx="8"/>
<text class="pn" x="66" y="848">Catalog sync</text>
<g class="pill-r88"><rect x="66" y="856" width="54" height="16" rx="8"/><text x="93" y="868">RFC-88</text></g>
<text class="m" x="126" y="868">type plane spoke</text>
<g class="boundary"><rect class="box" x="230" y="840" width="130" height="28" rx="6"/></g>
<text class="chip" x="295.0" y="858">HoodieSchema</text>
<g class="engine"><rect class="box" x="560" y="840" width="130" height="28" rx="6"/></g>
<text class="chip" x="625.0" y="858">catalog types</text>
<g class="persist"><rect class="box" x="890" y="840" width="170" height="28" rx="6"/></g>
<text class="chip" x="975.0" y="858">HMS / Glue / BigQuery</text>
<g class="persist"><rect class="box" x="1230" y="840" width="160" height="28" rx="6"/></g>
<text class="chip" x="1310.0" y="858">catalog updated</text>
<path class="edge" d="M360,854 L560,854" marker-end="url(#arr)"/>
<text class="lbl" x="460.0" y="848" text-anchor="middle">TypeSystemMapper</text>
<path class="edge" d="M690,854 L890,854" marker-end="url(#arr)"/>
<text class="lbl" x="790.0" y="848" text-anchor="middle">CatalogSchemaRenderer</text>
<path class="edge" d="M1060,854 L1230,854" marker-end="url(#arr)"/>
<text class="lbl" x="1145.0" y="848" text-anchor="middle">diff() -&gt; ALTER</text>
<text class="m" x="1230" y="884">VECTOR as binary declared LOSSY</text>
</svg>
